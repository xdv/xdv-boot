name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Clone dust compiler
        run: |
          git clone --depth 1 https://github.com/dustlang/dust.git ../dust

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: ../dust

      - name: Build Dust compiler
        run: |
          cd ../dust
          cargo build --workspace

      - name: Check xdv-boot source files
        run: |
          export PATH="$PWD/../dust/target/debug:$PATH"
          dust check src
          echo "All xdv-boot files check OK"

      - name: Verify XDV-062 flow markers
        run: |
          grep -q "strict handoff to kernel entry only" src/boot.ds
          grep -q "boot_verify_firmware_path" src/boot.ds
          grep -q "xdv-boot: failure:" src/boot.ds
          grep -q "xdv-boot: failure:" src/boot_mbr.ds
          grep -q "xdv-boot: failure:" src/boot_uefi.ds
          grep -q "test_mbr_kernel_path_parity_with_xdvfs" src/boot_mbr_tests.ds
          grep -q "test_uefi_kernel_path_parity_with_mbr" src/boot_uefi_tests.ds
          echo "XDV-062 markers present"